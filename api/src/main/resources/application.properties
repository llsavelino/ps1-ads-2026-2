spring.application.name=api

# Porta da aplicação
server.port=8080

# Paginação padrão
spring.data.web.pageable.default-page-size=3

# Rate limiting por endereço IP (janela deslizante)
app.rate-limit.max-requests=${RATE_LIMIT_MAX_REQUESTS:100}
app.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}

# Configuração do banco de dados PostgreSQL (Prisma)
spring.datasource.url=jdbc:postgresql://pooled.db.prisma.io:5432/postgres?sslmode=require
spring.datasource.username=78fb942c43bafdcb553b6f5a5d8ce2c0eb49f29109a7261c7fc00ff71db1d378
spring.datasource.password=sk_r9IQhRoUXR-eaaVLx_gHM
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuração Flyway (migrações)
spring.flyway.enabled=true
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false

# Timeout de conexão (evita travar startup se o banco estiver offline)
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=5

# JWT Configuration
jwt.secret=06afc6e4fa2dc9416159a364df3d7af99092e84c5941b4fc1b069f96777ccd5e

# E-mail de redefinição de senha (configure as variáveis SMTP_* no ambiente)
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.password-reset-url=${PASSWORD_RESET_URL:http://localhost:3000/reset-password}
app.mail-from=${SMTP_FROM:no-reply@localhost}
